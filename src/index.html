<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta charset="UTF-8" />
    <title>Arthur Gautheron</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/codehilite.css" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta description="Arthur Gautheron" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {{
        try {{
          var t = localStorage.getItem("theme");
          if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
        }} catch (e) {{}}
      }})();
    </script>
  </head>

  <body>
    <div class="main">
      <div class="navbar">
        <div class="name">
          <h1>Arthur Gautheron</h1>
        </div>
        <ul>
          <li><a href="/">About</a></li>
          <li><a href="/links">Links</a></li>
          <li><a href="/bookshelf">Shelves</a></li>
          <li><a href="/projects/">Projects</a></li>
          <li class="theme-item"><button class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Dark mode" title="Toggle dark mode">
              <span class="theme-icon" aria-hidden="true">☀</span>
              <span class="track" aria-hidden="true"><span class="thumb"></span></span>
              <span class="theme-icon" aria-hidden="true">☾</span>
            </button>
          </li>
        </ul>
      </div>
      <div class="page">{page}</div>
    </div>
    <script>
      (function () {{
        var root = document.documentElement;
        var btn = document.querySelector(".theme-toggle");
        var media = window.matchMedia("(prefers-color-scheme: dark)");
        function isDark() {{
          var t = root.getAttribute("data-theme");
          return t ? t === "dark" : media.matches;
        }}
        function sync() {{
          btn.setAttribute("aria-checked", isDark() ? "true" : "false");
        }}
        btn.addEventListener("click", function () {{
          var t = isDark() ? "light" : "dark";
          root.setAttribute("data-theme", t);
          try {{ localStorage.setItem("theme", t); }} catch (e) {{}}
          sync();
        }});
        if (media.addEventListener) media.addEventListener("change", sync);
        else if (media.addListener) media.addListener(sync);
        sync();
      }})();
      (function () {{
        var bar = document.querySelector(".profile-filter");
        if (!bar) return;
        var items = Array.prototype.slice.call(document.querySelectorAll(".page li")).filter(function (li) {{
          return li.querySelector(".profile");
        }});
        function codes(li) {{
          var c = li.querySelector(".profile").className;
          if (c.indexOf("p-vr") >= 0) return ["v", "r"];
          var m = c.match(/p-([vrd])/);
          return m ? [m[1]] : [];
        }}
        var buttons = bar.querySelectorAll("button");
        Array.prototype.forEach.call(buttons, function (b) {{
          var p = b.getAttribute("data-profile");
          var n = items.filter(function (li) {{ return p === "all" || codes(li).indexOf(p) >= 0; }}).length;
          var span = document.createElement("span");
          span.className = "count";
          span.textContent = "(" + n + ")";
          b.appendChild(span);
        }});
        function apply(p) {{
          items.forEach(function (li) {{
            li.hidden = !(p === "all" || codes(li).indexOf(p) >= 0);
          }});
          var lists = [];
          items.forEach(function (li) {{ if (lists.indexOf(li.parentNode) < 0) lists.push(li.parentNode); }});
          lists.forEach(function (ul) {{
            var any = ul.querySelector("li:not([hidden])") !== null;
            ul.hidden = !any;
            var h = ul.previousElementSibling;
            if (h && (h.tagName === "H4" || (h.tagName === "P" && /:\s*$/.test(h.textContent)))) h.hidden = !any;
          }});
          Array.prototype.forEach.call(document.querySelectorAll(".page h3"), function (h3) {{
            var el = h3.nextElementSibling, any = false, wine = false;
            while (el && el.tagName !== "H3" && el.tagName !== "H2") {{
              if (el.tagName === "UL" && el.querySelector(".profile")) {{ wine = true; if (!el.hidden) any = true; }}
              el = el.nextElementSibling;
            }}
            if (wine) h3.hidden = !any;
          }});
          Array.prototype.forEach.call(buttons, function (b) {{
            b.setAttribute("aria-pressed", b.getAttribute("data-profile") === p ? "true" : "false");
          }});
        }}
        bar.addEventListener("click", function (e) {{
          var b = e.target.closest ? e.target.closest("button") : null;
          if (b) apply(b.getAttribute("data-profile"));
        }});
      }})();
    </script>
  </body>
</html>
