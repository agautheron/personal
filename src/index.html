<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta charset="UTF-8" />
    <title>Arthur Gautheron</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/codehilite.css" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta description="Arthur Gautheron" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {{
        try {{
          var t = localStorage.getItem("theme");
          if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
        }} catch (e) {{}}
      }})();
    </script>
  </head>

  <body>
    <div class="main">
      <div class="navbar">
        <div class="name">
          <h1>Arthur Gautheron</h1>
        </div>
        <ul>
          <li><a href="/">About</a></li>
          <li><a href="/links">Links</a></li>
          <li><a href="/bookshelf">Bookshelf</a></li>
          <li><a href="/projects/">Projects</a></li>
          <li class="theme-item"><button class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Dark mode" title="Toggle dark mode">
              <span class="theme-icon" aria-hidden="true">☀</span>
              <span class="track" aria-hidden="true"><span class="thumb"></span></span>
              <span class="theme-icon" aria-hidden="true">☾</span>
            </button>
          </li>
        </ul>
      </div>
      <div class="page">{page}</div>
    </div>
    <script>
      (function () {{
        var root = document.documentElement;
        var btn = document.querySelector(".theme-toggle");
        var media = window.matchMedia("(prefers-color-scheme: dark)");
        function isDark() {{
          var t = root.getAttribute("data-theme");
          return t ? t === "dark" : media.matches;
        }}
        function sync() {{
          btn.setAttribute("aria-checked", isDark() ? "true" : "false");
        }}
        btn.addEventListener("click", function () {{
          var t = isDark() ? "light" : "dark";
          root.setAttribute("data-theme", t);
          try {{ localStorage.setItem("theme", t); }} catch (e) {{}}
          sync();
        }});
        if (media.addEventListener) media.addEventListener("change", sync);
        else if (media.addListener) media.addListener(sync);
        sync();
      }})();
    </script>
  </body>
</html>
